name: Build Release (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da Release (ex.: 2.0.0)'
        required: true
        default: '2.2.0'
        type: string

concurrency:
  group: manual-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOLUTION: RenomearTudo.sln
  CONFIGURATION: Release

jobs:
  build:
    name: Build, test and installer
    runs-on: windows-2025
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Validate version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ inputs.version }}'.Trim()
          if ($version.StartsWith('v', [System.StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Use uma versão no formato X.Y.Z, por exemplo 2.0.0.'
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate repository structure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $legacyDirectories = Get-ChildItem -Path $PWD -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @('Codigo', 'Código') }
          if ($legacyDirectories) {
            $legacyDirectories.FullName | ForEach-Object { Write-Error "Pasta legada não permitida: $_" }
            throw 'O repositório contém pasta de código legado que não deve fazer parte da versão moderna.'
          }

          $legacyExtensions = @('.obj', '.bpl', '.bpi', '.tds')
          $legacyFiles = Get-ChildItem -Path $PWD -File -Recurse -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -ieq 'setup.exe' -or $legacyExtensions -contains $_.Extension.ToLowerInvariant()
          }
          if ($legacyFiles) {
            $legacyFiles.FullName | ForEach-Object { Write-Error "Artefato legado não permitido: $_" }
            throw 'Foram encontrados binários/artefatos legados no repositório.'
          }

          $required = @(
            'RenomearTudo.sln',
            'src\RenomearTudo.App\RenomearTudo.App.csproj',
            'src\RenomearTudo.Core\RenomearTudo.Core.csproj',
            'tests\RenomearTudo.SmokeTests\RenomearTudo.SmokeTests.csproj',
            'installer\RenomearTudo.iss'
          )
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $PWD $file) -PathType Leaf)) {
              throw "Arquivo obrigatório ausente: $file"
            }
          }

          Write-Host 'Repository structure: OK'

      - name: Static XAML binding audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$xaml = Get-Content 'src\RenomearTudo.App\MainWindow.xaml' -Raw
          if (-not $xaml.DocumentElement) { throw 'MainWindow.xaml não pôde ser analisado como XML.' }

          $raw = Get-Content 'src\RenomearTudo.App\MainWindow.xaml' -Raw
          $runBindings = [regex]::Matches($raw, '<Run\b[^>]*Text="\{Binding[^"]+"[^>]*/?>')
          $unsafe = @($runBindings | Where-Object { $_.Value -notmatch 'Mode=OneWay' })
          if ($unsafe.Count -gt 0) {
            $unsafe | ForEach-Object { Write-Error "Run binding sem Mode=OneWay: $($_.Value)" }
            throw 'Bindings de texto inline sem Mode=OneWay podem causar crash em propriedades somente leitura.'
          }

          Write-Host 'Static XAML binding audit: OK'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Restore
        shell: pwsh
        run: msbuild $env:SOLUTION /t:Restore /p:Configuration=$env:CONFIGURATION

      - name: Build
        shell: pwsh
        run: msbuild $env:SOLUTION /t:Rebuild /m /p:Configuration=$env:CONFIGURATION /p:CI=true /p:Version=$env:VERSION /p:TreatWarningsAsErrors=true

      - name: Core smoke tests
        shell: pwsh
        run: .\tests\RenomearTudo.SmokeTests\bin\Release\net48\RenomearTudo.SmokeTests.exe

      - name: GUI startup test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'src\RenomearTudo.App\bin\Release\net48\RenomearTudo.exe'
          $log = Join-Path $env:LOCALAPPDATA 'RenomearTudo\logs\startup.log'

          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "Executável não encontrado para o teste de inicialização: $exe"
          }

          # WinExe não atualiza $LASTEXITCODE de forma confiável quando iniciado com '&'.
          # Start-Process -PassThru fornece o ExitCode real do processo.
          if (Test-Path $log) { Remove-Item $log -Force -ErrorAction SilentlyContinue }
          $process = Start-Process -FilePath $exe -ArgumentList '--startup-check' -PassThru

          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $log) { Get-Content $log }
            throw 'O aplicativo não concluiu o teste de inicialização em 30 segundos.'
          }

          $process.Refresh()
          $exitCode = $process.ExitCode

          if (Test-Path $log) {
            Get-Content $log
          } else {
            throw 'O aplicativo terminou sem gerar o log de inicialização esperado.'
          }

          if ($exitCode -ne 0) {
            throw "O aplicativo falhou no teste real de inicialização. Código: $exitCode"
          }

          if (-not (Select-String -Path $log -SimpleMatch 'Binding diagnostics: OK.' -Quiet)) {
            throw 'O diagnóstico de bindings WPF não foi confirmado pelo startup-check.'
          }

          if (-not (Select-String -Path $log -SimpleMatch 'Responsive layout check: OK.' -Quiet)) {
            throw 'Os breakpoints responsivos não foram confirmados pelo startup-check.'
          }

          if (-not (Select-String -Path $log -SimpleMatch 'Theme switch check: OK.' -Quiet)) {
            throw 'A troca de tema Claro/Escuro/Sistema não foi confirmada pelo startup-check.'
          }

          if (-not (Select-String -Path $log -SimpleMatch 'Startup check: OK.' -Quiet)) {
            throw 'O processo retornou sucesso, mas o startup-check não confirmou a inicialização completa.'
          }

          Write-Host 'GUI startup + theme test: OK'

      - name: Prepare portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'dist'
          $app = Join-Path $PWD 'src\RenomearTudo.App\bin\Release\net48'
          $stage = Join-Path $out 'portable\RenomearTudo'

          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $required = @(
            (Join-Path $app 'RenomearTudo.exe'),
            (Join-Path $app 'RenomearTudo.exe.config'),
            (Join-Path $app 'RenomearTudo.Core.dll'),
            (Join-Path $PWD 'README.md'),
            (Join-Path $PWD 'NOTICE.md'),
            (Join-Path $PWD 'LICENSE-ORIGINAL.txt')
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Arquivo obrigatório não encontrado: $file"
            }
          }

          Copy-Item (Join-Path $app 'RenomearTudo.exe') $stage
          Copy-Item (Join-Path $app 'RenomearTudo.exe.config') $stage
          Copy-Item (Join-Path $app 'RenomearTudo.Core.dll') $stage
          Copy-Item 'README.md' $stage
          Copy-Item 'NOTICE.md' $stage
          Copy-Item 'LICENSE-ORIGINAL.txt' $stage

          Compress-Archive -Path "$stage\*" -DestinationPath "$out\RenomearTudo-Portable-$env:VERSION.zip" -CompressionLevel Optimal -Force

      - name: Download offline .NET Framework 4.8 prerequisite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $PWD 'installer\prerequisites'
          $file = Join-Path $dir 'NDP48-x86-x64-AllOS-ENU.exe'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $urls = @(
            'https://go.microsoft.com/fwlink/?linkid=2088631',
            'https://download.microsoft.com/download/f/3/a/f3a6af84-da23-40a5-8d1c-49cc10c8e76f/NDP48-x86-x64-AllOS-ENU.exe'
          )

          $downloaded = $false
          foreach ($url in $urls) {
            for ($attempt = 1; $attempt -le 3 -and -not $downloaded; $attempt++) {
              try {
                if (Test-Path $file) { Remove-Item $file -Force }
                Write-Host "Baixando .NET Framework 4.8 (tentativa $attempt): $url"
                Invoke-WebRequest -Uri $url -OutFile $file -UseBasicParsing -TimeoutSec 180
                if ((Test-Path $file -PathType Leaf) -and (Get-Item $file).Length -ge 50MB) {
                  $downloaded = $true
                }
              } catch {
                Write-Warning $_.Exception.Message
                Start-Sleep -Seconds 3
              }
            }
            if ($downloaded) { break }
          }

          if (-not $downloaded) {
            throw 'O instalador offline oficial do .NET Framework 4.8 não pôde ser baixado corretamente.'
          }

          $signature = Get-AuthenticodeSignature $file
          if ($signature.Status -ne 'Valid') {
            throw "Assinatura do .NET Framework inválida: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw "O pré-requisito não está assinado pela Microsoft: $($signature.SignerCertificate.Subject)"
          }

          Write-Host "Pré-requisito Microsoft validado: $($signature.SignerCertificate.Subject)"
          Get-FileHash $file -Algorithm SHA256 | Format-List

      - name: Build offline installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue),
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { $_ -and (Test-Path $_ -PathType Leaf) }

          $iscc = $candidates | Select-Object -First 1
          if (-not $iscc) {
            Write-Host 'Inno Setup não encontrado no runner. Instalando via Chocolatey...'
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao instalar Inno Setup via Chocolatey. Código: $LASTEXITCODE"
            }

            $candidates = @(
              (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue),
              'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
              'C:\Program Files\Inno Setup 6\ISCC.exe'
            ) | Where-Object { $_ -and (Test-Path $_ -PathType Leaf) }
            $iscc = $candidates | Select-Object -First 1
          }

          if (-not $iscc) {
            throw 'ISCC.exe (Inno Setup) não pôde ser localizado nem instalado.'
          }

          Write-Host "Usando Inno Setup: $iscc"
          & $iscc "/DMyAppVersion=$env:VERSION" 'installer\RenomearTudo.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup falhou com código $LASTEXITCODE"
          }

          $setup = Join-Path $PWD "dist\RenomearTudo-Setup-$env:VERSION.exe"
          if (-not (Test-Path $setup -PathType Leaf)) {
            throw "O instalador esperado não foi gerado: $setup"
          }

      - name: Test generated installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD "dist\RenomearTudo-Setup-$env:VERSION.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "RenomearTudo-InstallTest-$env:VERSION"
          $setupLog = Join-Path $env:RUNNER_TEMP "RenomearTudo-Setup-$env:VERSION.log"
          $startupLog = Join-Path $env:LOCALAPPDATA 'RenomearTudo\logs\startup.log'

          if (-not (Test-Path $setup -PathType Leaf)) {
            throw "Instalador não encontrado para teste: $setup"
          }

          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          if (Test-Path $setupLog) { Remove-Item $setupLog -Force }
          if (Test-Path $startupLog) { Remove-Item $startupLog -Force -ErrorAction SilentlyContinue }

          $arguments = @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            "/DIR=$installDir",
            "/LOG=$setupLog"
          )

          $installer = Start-Process -FilePath $setup -ArgumentList $arguments -PassThru
          if (-not $installer.WaitForExit(120000)) {
            Stop-Process -Id $installer.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $setupLog) { Get-Content $setupLog }
            throw 'O instalador não concluiu o teste silencioso em 120 segundos.'
          }
          $installer.Refresh()
          if ($installer.ExitCode -ne 0) {
            if (Test-Path $setupLog) { Get-Content $setupLog }
            throw "O instalador falhou no teste silencioso. Código: $($installer.ExitCode)"
          }

          $installedExe = Join-Path $installDir 'RenomearTudo.exe'
          $requiredInstalled = @(
            $installedExe,
            (Join-Path $installDir 'RenomearTudo.exe.config'),
            (Join-Path $installDir 'RenomearTudo.Core.dll')
          )
          foreach ($file in $requiredInstalled) {
            if (-not (Test-Path $file -PathType Leaf)) {
              if (Test-Path $setupLog) { Get-Content $setupLog }
              throw "Arquivo ausente após instalar o Setup: $file"
            }
          }

          if (Test-Path $startupLog) { Remove-Item $startupLog -Force -ErrorAction SilentlyContinue }
          $app = Start-Process -FilePath $installedExe -ArgumentList '--startup-check' -PassThru
          if (-not $app.WaitForExit(30000)) {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $startupLog) { Get-Content $startupLog }
            throw 'A aplicação instalada não concluiu o startup-check em 30 segundos.'
          }
          $app.Refresh()
          if ($app.ExitCode -ne 0) {
            if (Test-Path $startupLog) { Get-Content $startupLog }
            throw "A aplicação instalada falhou no startup-check. Código: $($app.ExitCode)"
          }
          if (-not (Test-Path $startupLog -PathType Leaf)) {
            throw 'A aplicação instalada não gerou o startup.log esperado.'
          }
          if (-not (Select-String -Path $startupLog -SimpleMatch 'Binding diagnostics: OK.' -Quiet)) {
            Get-Content $startupLog
            throw 'A aplicação instalada não confirmou Binding diagnostics: OK.'
          }
          if (-not (Select-String -Path $startupLog -SimpleMatch 'Responsive layout check: OK.' -Quiet)) {
            Get-Content $startupLog
            throw 'A aplicação instalada não confirmou Responsive layout check: OK.'
          }
          if (-not (Select-String -Path $startupLog -SimpleMatch 'Theme switch check: OK.' -Quiet)) {
            Get-Content $startupLog
            throw 'A aplicação instalada não confirmou Theme switch check: OK.'
          }
          if (-not (Select-String -Path $startupLog -SimpleMatch 'Startup check: OK.' -Quiet)) {
            if (Test-Path $startupLog) { Get-Content $startupLog }
            throw 'A aplicação instalada não confirmou Startup check: OK.'
          }

          Write-Host 'Installer integration + responsive/theme test: OK'
          Get-Content $startupLog

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (Test-Path $uninstaller -PathType Leaf) {
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru
            if (-not $uninstall.WaitForExit(60000)) {
              Stop-Process -Id $uninstall.Id -Force -ErrorAction SilentlyContinue
              Write-Warning 'O desinstalador de teste não concluiu em 60 segundos.'
            } else {
              $uninstall.Refresh()
              if ($uninstall.ExitCode -ne 0) {
                Write-Warning "Uninstaller de teste retornou código $($uninstall.ExitCode)."
              }
            }
          }
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue }

      - name: Microsoft Defender scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scanPath = Join-Path $PWD 'dist'
          $candidates = @((Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'))
          $platformRoot = Join-Path $env:ProgramData 'Microsoft\Windows Defender\Platform'

          if (Test-Path $platformRoot) {
            $latest = Get-ChildItem $platformRoot -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              Select-Object -First 1
            if ($latest) { $candidates += Join-Path $latest.FullName 'MpCmdRun.exe' }
          }

          $defender = $candidates | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if ($defender) {
            & $defender -Scan -ScanType 3 -File $scanPath
            if ($LASTEXITCODE -ne 0) {
              throw "Microsoft Defender retornou código $LASTEXITCODE"
            }
          } else {
            Write-Warning 'Microsoft Defender CLI não está disponível neste runner.'
          }

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            "dist\RenomearTudo-Setup-$env:VERSION.exe",
            "dist\RenomearTudo-Portable-$env:VERSION.zip"
          )

          $lines = foreach ($file in $files) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Arquivo ausente: $file" }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content 'dist\SHA256SUMS.txt' -Encoding ascii
          Get-Content 'dist\SHA256SUMS.txt'

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: RenomearTudo-${{ steps.version.outputs.tag }}
          path: |
            dist/RenomearTudo-Setup-${{ steps.version.outputs.version }}.exe
            dist/RenomearTudo-Portable-${{ steps.version.outputs.version }}.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - name: Download tested artifacts
        uses: actions/download-artifact@v8
        with:
          name: RenomearTudo-${{ needs.build.outputs.tag }}
          path: dist

      - name: Publish or update Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            "dist\RenomearTudo-Setup-$env:RELEASE_VERSION.exe",
            "dist\RenomearTudo-Portable-$env:RELEASE_VERSION.zip",
            'dist\SHA256SUMS.txt'
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Arquivo de Release não encontrado: $file"
            }
          }

          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            throw 'GitHub CLI (gh) não está disponível no runner.'
          }

          $PSNativeCommandUseErrorActionPreference = $false

          # Se a tag já existir, ela precisa apontar exatamente para o commit compilado.
          # Isso impede anexar binários novos a uma tag antiga por acidente.
          gh api "repos/$env:GH_REPO/git/ref/tags/$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            $tagCommitRaw = gh api "repos/$env:GH_REPO/commits/$env:RELEASE_TAG" --jq '.sha'
            $tagCommitExit = $LASTEXITCODE
            $tagCommit = if ($null -eq $tagCommitRaw) { '' } else { ([string]$tagCommitRaw).Trim() }
            if ($tagCommitExit -ne 0 -or [string]::IsNullOrWhiteSpace($tagCommit)) {
              throw "Não foi possível resolver o commit da tag $env:RELEASE_TAG."
            }
            if (-not [string]::Equals($tagCommit, $env:TARGET_SHA, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "A tag $env:RELEASE_TAG já aponta para $tagCommit, mas este build usa $env:TARGET_SHA. Use uma nova versão para não misturar artefatos de commits diferentes."
            }
          }

          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @files --clobber --repo $env:GH_REPO
            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao atualizar os artefatos da Release $env:RELEASE_TAG. Código: $LASTEXITCODE"
            }
            Write-Host "Release existente atualizada: $env:RELEASE_TAG"
          } else {
            gh release create $env:RELEASE_TAG @files `
              --target $env:TARGET_SHA `
              --title "Renomear Tudo $env:RELEASE_TAG" `
              --generate-notes `
              --repo $env:GH_REPO
            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao criar a Release $env:RELEASE_TAG. Código: $LASTEXITCODE"
            }
            Write-Host "Release criada: $env:RELEASE_TAG"
          }
