name: Build, Test and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION: RenomearTudo.sln
  CONFIGURATION: Release

jobs:
  build:
    name: Build and test
    runs-on: windows-2025
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Restore
        shell: pwsh
        run: msbuild $env:SOLUTION /t:Restore /p:Configuration=$env:CONFIGURATION

      - name: Build
        shell: pwsh
        run: msbuild $env:SOLUTION /m /p:Configuration=$env:CONFIGURATION /p:CI=true

      - name: Smoke tests
        shell: pwsh
        run: .\tests\RenomearTudo.SmokeTests\bin\Release\net48\RenomearTudo.SmokeTests.exe

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'dist'
          $app = Join-Path $PWD 'src\RenomearTudo.App\bin\Release\net48'
          $stage = Join-Path $out 'RenomearTudo'

          if (Test-Path $out) {
            Remove-Item $out -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $required = @(
            (Join-Path $app 'RenomearTudo.exe'),
            (Join-Path $app 'RenomearTudo.Core.dll'),
            (Join-Path $PWD 'README.md'),
            (Join-Path $PWD 'NOTICE.md'),
            (Join-Path $PWD 'LICENSE-ORIGINAL.txt')
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Arquivo obrigatório não encontrado: $file"
            }
          }

          Copy-Item (Join-Path $app 'RenomearTudo.exe') $stage
          $config = Join-Path $app 'RenomearTudo.exe.config'
          if (Test-Path $config -PathType Leaf) {
            Copy-Item $config $stage
          }
          Copy-Item (Join-Path $app 'RenomearTudo.Core.dll') $stage
          Copy-Item 'README.md' $stage
          Copy-Item 'NOTICE.md' $stage
          Copy-Item 'LICENSE-ORIGINAL.txt' $stage

          Compress-Archive -Path "$stage\*" -DestinationPath "$out\RenomearTudo-Windows.zip" -CompressionLevel Optimal -Force
          $hash = (Get-FileHash "$out\RenomearTudo-Windows.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RenomearTudo-Windows.zip" | Set-Content "$out\SHA256SUMS.txt" -Encoding ascii

      - name: Microsoft Defender scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scanPath = Join-Path $PWD 'dist\RenomearTudo'
          $candidates = @(
            (Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe')
          )

          $platformRoot = Join-Path $env:ProgramData 'Microsoft\Windows Defender\Platform'
          if (Test-Path $platformRoot) {
            $latest = Get-ChildItem $platformRoot -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              Select-Object -First 1
            if ($latest) {
              $candidates += Join-Path $latest.FullName 'MpCmdRun.exe'
            }
          }

          $defender = $candidates | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if ($defender) {
            & $defender -Scan -ScanType 3 -File $scanPath
            if ($LASTEXITCODE -ne 0) {
              throw "Microsoft Defender retornou código $LASTEXITCODE"
            }
          } else {
            Write-Host 'Microsoft Defender CLI não disponível neste runner; etapa ignorada.'
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: RenomearTudo-Windows
          path: |
            dist/RenomearTudo-Windows.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v8
        with:
          name: RenomearTudo-Windows
          path: dist

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          $files = @(
            'dist/RenomearTudo-Windows.zip',
            'dist/SHA256SUMS.txt'
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Arquivo de release não encontrado: $file"
            }
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "Renomear Tudo $tag" --generate-notes
          }
